name: TunisianCards
options:
  bundleIdPrefix: io.cappsule
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  TunisianCards:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cappsule.tunisiancards
        INFOPLIST_KEY_CFBundleDisplayName: Cards
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
  EngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/EngineTests
    dependencies:
      - target: TunisianCards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cappsule.tunisiancards.enginetests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TunisianCards.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TunisianCards"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TunisianCards:
    build:
      targets:
        TunisianCards: all
        EngineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EngineTests
